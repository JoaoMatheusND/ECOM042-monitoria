CONFIG_ZTEST=y
CONFIG_GPIO=y
CONFIG_GPIO_EMUL=y
CONFIG_LOG=y

# Tick de 0,1 ms (o padrao do native_sim e 10 ms): a amostragem de 1 ms
# dos testes passa a enxergar cada troca no instante certo.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000

# Periodos curtos para os testes rodarem rapido.
CONFIG_APP_LED_SLOW_PERIOD_MS=400
CONFIG_APP_LED_NORMAL_PERIOD_MS=200
CONFIG_APP_LED_FAST_PERIOD_MS=40
