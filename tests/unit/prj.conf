CONFIG_ZTEST=y
CONFIG_GPIO=y
# LOG_ERR compilado de verdade (argumentos invalidos)
CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=4096

# Resolucao de 1 ms: os testes medem periodos curtos.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# Periodos curtos so para o teste (no app valem os defaults do Kconfig).
CONFIG_LED_PERIOD_SLOW_MS=100
CONFIG_LED_PERIOD_NORMAL_MS=40
CONFIG_LED_PERIOD_FAST_MS=20
