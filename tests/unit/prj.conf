CONFIG_ZTEST=y
CONFIG_GPIO=y
CONFIG_GPIO_EMUL=y
CONFIG_LOG=y

# Tick de 1 ms (o padrao do native_sim e 10 ms) para medir fase com precisao.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# Periodos curtos: varias trocas por janela de teste, suite rapida.
CONFIG_APP_LED_PERIOD_SLOW_MS=400
CONFIG_APP_LED_PERIOD_NORMAL_MS=200
CONFIG_APP_LED_PERIOD_FAST_MS=100
