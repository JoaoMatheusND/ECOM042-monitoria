# Console (printk) na uart0; a uart1 e o canal de comandos.
# As duas UARTs ficam cada uma no seu pseudo-terminal: o log mostra o
# caminho da uart1 (/dev/pts/N) para abrir com screen/picocom.
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# LED (led0) e botao (sw0) vem do devicetree via gpio0.
CONFIG_GPIO=y

CONFIG_MAIN_STACK_SIZE=2048
