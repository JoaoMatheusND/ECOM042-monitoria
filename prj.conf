# LED e botao vêm do devicetree (aliases led0 e sw0). No native_sim o
# driver do GPIO emulado liga sozinho; forcar aqui quebraria placa real.
CONFIG_GPIO=y

# O no sw0 e descrito como gpio-keys, mas este firmware le o pino direto.
# O driver de input tomaria o pino e a leitura do botao falharia.
CONFIG_INPUT_GPIO_KEYS=n

# Console (printk) fica na uart0. Os comandos usam a uart1, por interrupcao.
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

CONFIG_APP_CMD_LINE_MAX=64
